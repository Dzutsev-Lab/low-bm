# BLAST-only config for confirming the top 10 genus-level taxa by abundance.
# This is intentionally smaller than analysis_config.yaml and does not require
# differential abundance outputs.

project:
  name: "low_biomass_analysis"
  base_dir: "Exp_Output"
  trialID: "070826.2"
  output_dir: "Exp_Output/070826.2_DSSModelExp2_InitialRun"
  compiled_physeq: "Exp_Output/070826.2_DSSModelExp2_InitialRun/070826.2_physeq.RData"
  # Optional. If omitted, BLASTCandidatePreparation.R will look for
  # MergedASV.fasta or <trialID>_ASV.fasta beside compiled_physeq.
  # compiled_asv_fasta: <compiled_ASV>.fasta
  tax_agg_level: "Genus"
  pseudocount: 1

blast_confirmation:
  # Required for top-N candidate selection.
  candidate_source: "top_abundance"

  # Required by candidate prep, wrapper, and plotting. This becomes the
  # comparison-like directory name under BlastAnalysis.
  candidate_comparisons: ["Top10Genera_NoPippin"]

  # Required for a top 10 analysis.
  top_n_taxa: 10

  # Optional but recommended for a batch-specific top 10. Replace this value
  # with the SequencingBatch you want, or remove candidate_sample_filter to use
  # the full compiled project.
  candidate_sample_filter:
    Pippin: [0]

  # Pre-Abundance Ranking Normalization Options
  candidate_norm_method: "log2HostMapped"
  candidate_pseudocount: 1

  # BLAST Options
  reference_db: "ncbi20_k2"
  ref_base_dir: "Ref_Data"
  tax_db_sql: "Ref_Data/taxdump/tax_db.sqlite"
  max_target_seqs: 5
  num_threads: null
  min_pident: 90
  min_qcovs: 90
  max_evalue: 1e-20
  top_n_asvs: 20
  min_rel_abund: 0.05
  plot_ranks: ["genus", "species"]
