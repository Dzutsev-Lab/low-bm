project:
  name: "low_biomass_analysis"
  batch_table: "experiment_batch_configs.tsv"
  base_dir: "Exp_Output"
  output_dir: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial"
  compiled_physeq: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial/CompPhyseq.RData"
  compiled_asv_fasta: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial/MergedASV.fasta"
  techrep_avg: false

ordination:
  trialID: "060426.1"
  norm_method: "log2HostMapped"
  pseudocount: 1
  tax_agg_level: "Genus"
  batch_adj_covar: "Hospital"
  dist_metrics: null
  groupings:
    - name: "SampleType"
      variable: "SampleType"
    - name: "TumorType"
      variable: "TumorType"
      sample_filter:
        SampleType: ["Tumor"]
    - name: "TumorNontumorType"
      variable: "TumorType"
      sample_filter:
        SampleType: ["Tumor", "Nontumor"]
    - name: "cCluster"
      variable: "cCluster"
      sample_filter:
        SampleType: ["Tumor"]

heatmap_violin:
  norm_method: "noNorm"
  pseudocount: 1
  tax_agg_level: "Genus"
  batch_adj: false
  limma_voom: false

differential_abundance:
  trialID: "060426.1"
  methods: ["ANCOMBC"]
  output_dir: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial"
  norm_method: "log2HostMapped"
  pseudocount: 1
  tax_agg_level: "Genus"
  tax_label_level: "Genus"
  alpha: 0.05
  lfc_cutoff: 0.3
  comparisons:
    - name: "NegativeControl"
      sample_filter:
        SampleType: ["NegativeControl", "Tumor", "Nontumor", "NormalTissue"]
      factor_levels:
        ControlStatus: ["Control", "PatientSample"]
      formula: "ControlStatus"
      group: "ControlStatus"
      coefficient: "ControlStatusPatientSample"
      structural_zero_groups:
        - "structural_zero (ControlStatus = Control)"
        - "structural_zero (ControlStatus = PatientSample)"
      plot_title: "NegativeControl vs Patient Samples"

    - name: "PatientSample"
      sample_filter:
        SampleType: ["Nontumor", "NormalTissue", "Tumor"]
      factor_levels:
        SampleType: ["Nontumor", "NormalTissue", "Tumor"]
      formula: "SampleType + PatientID"
      group: "SampleType"
      coefficient: "SampleTypeTumor"
      structural_zero_groups:
        - "structural_zero (SampleType = Nontumor)"
        - "structural_zero (SampleType = Tumor)"
      plot_title: "Nontumor/Normal Tissue vs Tumor"

    - name: "TumorType"
      sample_filter:
        SampleType: ["Tumor"]
      factor_levels:
        TumorType: ["HCC", "iCC"]
      formula: "TumorType"
      group: "TumorType"
      coefficient: "TumorTypeiCC"
      structural_zero_groups:
        - "structural_zero (TumorType = HCC)"
        - "structural_zero (TumorType = iCC)"
      plot_title: "Tumor Type"

blast_confirmation:
  DA_comparisons: ["NegativeControl", "PatientSample", "TumorType"]
  DA_method: "ANCOMBC"
  trialID: "060426.1"
  io_dir: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial"
  taxa_level: "Genus"
  reference_db: "ncbi20_k2"
  ref_base_dir: "Ref_Data"
  tax_db_sql: "Ref_Data/taxdump/tax_db.sqlite"
  max_target_seqs: 5
  num_threads: null
  min_pident: 90
  min_qcovs: 90
  max_evalue: 1e-20
  top_n_asvs: 20
  min_rel_abund: 0.05
  plot_ranks: ["genus", "species"]

xgboost_classification: 
  trialID: "060426.1"
  io_dir: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial"
  tax_agg_level: "Genus"
  norm_method: log2
  pseudocount: 1
  class_factor: "TumorType"
  batch_adj_formula: "~ TumorType"
  batch_adj_covar: "Hospital"
  batch_adj_method: "LimmaRemoveBatchEffect"
