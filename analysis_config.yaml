project:
  name: "low_biomass_analysis"
  batch_table: "experiment_batch_configs.tsv"
  base_dir: "Exp_Output"
  trialID: "061526.1"
  output_dir: "Exp_Output/062426.1_TIGERAllExpComp_LEfSe"
  compiled_physeq: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial/CompPhyseq.RData"
  compiled_asv_fasta: "Exp_Output/060426.1_TIGERAllExpComp_CodexTrial/MergedASV.fasta"
  norm_method: "log2HostMapped"
  pseudocount: 1
  tax_agg_level: "Genus"
  techrep_avg: false

ordination:
  batch_adj_covar: "Hospital"
  batch_adj_method: "LimmaRemoveBatchEffect"
  batch_adj_formula: "~ SampleType"
  dist_metrics: null
  groupings:
    - name: "SampleType"
      variable: "SampleType"
      batch_adj_formula: "~ SampleType"
    - name: "TumorType"
      variable: "TumorType"
      sample_filter:
        SampleType: ["Tumor"]
      batch_adj_formula: "~ TumorType"
    - name: "TumorNontumorType"
      variable: "TumorType"
      sample_filter:
        SampleType: ["Tumor", "Nontumor"]
      batch_adj_formula: "~ TumorType"
    - name: "cCluster"
      variable: "cCluster"
      sample_filter:
        SampleType: ["Tumor"]
      batch_adj_formula: "~ cCluster"

heatmap_violin:
  norm_method: "noNorm"
  batch_adj: false
  limma_voom: false

abundance_barplots:
  norm_method: "noNorm"
  pseudocount: 1
  plots:
    - name: "SampleType_Genus"
      x: "SampleID"
      facet: "SampleType"
      sample_filter:
        SampleType: ["Tumor", "Nontumor"]
      tax_agg_level: "Genus"
      fill_tax_level: "Genus"
      taxa_display: "top_n"
      top_n: 20

    - name: "TumorType_Genus_AllTaxa"
      x: "SampleID"
      facet: "TumorType"
      sample_filter:
        SampleType: ["Tumor"]
      tax_agg_level: "Genus"
      fill_tax_level: "Genus"
      taxa_display: "all"

differential_abundance:
  methods: ["ANCOMBC"]
  tax_label_level: "Genus"
  alpha: 0.05
  lfc_cutoff: 0.3
  comparisons:
    - name: "NegativeControl"
      sample_filter:
        SampleType: ["NegativeControl", "Tumor", "Nontumor", "NormalTissue"]
      factor_levels:
        ControlStatus: ["Control", "PatientSample"]
      formula: "ControlStatus"
      group: "ControlStatus"
      coefficient: "ControlStatusPatientSample"
      structural_zero_groups:
        - "structural_zero (ControlStatus = Control)"
        - "structural_zero (ControlStatus = PatientSample)"
      plot_title: "NegativeControl vs Patient Samples"

    - name: "PatientSample"
      sample_filter:
        SampleType: ["Nontumor", "NormalTissue", "Tumor"]
      factor_levels:
        SampleType: ["Nontumor", "NormalTissue", "Tumor"]
      formula: "SampleType + PatientID"
      group: "SampleType"
      coefficient: "SampleTypeTumor"
      structural_zero_groups:
        - "structural_zero (SampleType = Nontumor)"
        - "structural_zero (SampleType = Tumor)"
      plot_title: "Nontumor/Normal Tissue vs Tumor"

    - name: "TumorType"
      sample_filter:
        SampleType: ["Tumor"]
      factor_levels:
        TumorType: ["HCC", "iCC"]
      formula: "TumorType"
      group: "TumorType"
      coefficient: "TumorTypeiCC"
      structural_zero_groups:
        - "structural_zero (TumorType = HCC)"
        - "structural_zero (TumorType = iCC)"
      plot_title: "Tumor Type"

lefse_analysis:
  source_comparisons: "differential_abundance"
  abundance_scale: "raw_relative_abundance"
  p_adjust_method: "none"
  kruskal_threshold: 0.05
  wilcox_threshold: 0.05
  lda_threshold: 2
  filter: "nonzero"
  subclass_col: null
  seed: 42

blast_confirmation:
  DA_comparisons: ["NegativeControl", "PatientSample", "TumorType"]
  DA_method: "ANCOMBC"
  reference_db: "ncbi20_k2"
  ref_base_dir: "Ref_Data"
  tax_db_sql: "Ref_Data/taxdump/tax_db.sqlite"
  max_target_seqs: 5
  num_threads: null
  min_pident: 90
  min_qcovs: 90
  max_evalue: 1e-20
  top_n_asvs: 20
  min_rel_abund: 0.05
  plot_ranks: ["genus", "species"]

xgboost_classification: 
  class_factors: ["PatientSample", "TumorType"]
  batch_adj_formula: null
  batch_adj_covar: "Hospital"
  batch_adj_method: "LimmaRemoveBatchEffect"

survival_analysis:
  time_col: "SurvivalDays"
  status_col: "SurvivalStatus"
  patient_id_col: "PatientID"
  event_code: 1
  censor_code: 0
  min_n: 30
  min_events: 10
  taxa_pseudocount: 1e-6
  analyses:
    - name: "TumorSurvival"
      sample_filter:
        SampleType: ["Tumor"]
      covariates: ["Age", "Gender", "TumorType", "Hospital", "SequencingBatch"]
      tax_agg_level: "Genus"
      abundance_norm_method: "RelAbund"
      cox_feature_transform: "log2_pseudocount"
      pcoa_distance: "bray"
      pcoa_axes: 3
      alpha_measures: ["Shannon", "Simpson"]
      taxa_min_prevalence: 0.10
      taxa_min_mean_relative_abundance: 0.00001
      km_cutpoint: "median"
      km_top_n: 20
