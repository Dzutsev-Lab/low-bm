# Analysis config template.
#
# Initialize an ignored config/local/analysis.yaml from this file for
# project-specific analysis runs. Remove sections you do not plan to run.

project:
  name: "low_biomass_analysis"
  base_dir: "Exp_Output"
  trialID: "<trialID>"
  output_dir: "Exp_Output/<trialID>_<trial_descript>"
  # Standard analyses consume one endpoint. For multi-batch analyses, first run
  # `low-bm meta compile-phyloseq`, then point these fields at CompPhyseq.RData
  # and MergedASV.fasta.
  compiled_physeq: "Exp_Output/<trialID>_<trial_descript>/<trialID>_physeq.RData"
  # Optional. If omitted, BLAST candidate preparation can look for MergedASV.fasta
  # or <trialID>_ASV.fasta beside compiled_physeq.
  compiled_asv_fasta: null
  norm_method: "log2HostMapped"
  pseudocount: 1
  tax_agg_level: "Genus"

ordination:
  batch_adj_covar: false
  dist_metrics: null
  groupings:
    - name: "SampleType"
      variable: "SampleType"

heatmap_violin:
  norm_method: "noNorm"
  batch_adj: false
  limma_voom: false

abundance_barplots:
  plots:
    - name: "SampleType_log2HostMapped_top20"
      x: "SampleID"
      facet: "SampleType"
      tax_agg_level: "Genus"
      fill_tax_level: "Genus"
      taxa_display: "top_n"
      top_n: 20

differential_abundance:
  methods: ["ANCOMBC2"]
  tax_label_level: "Genus"
  alpha: 0.05
  lfc_cutoff: 0.3
  # ANCOM-BC2 defaults. Per-comparison values override these.
  p_adj_method: "holm"
  pseudo_sens: true
  prv_cut: 0.10
  lib_cut: 1000
  s0_perc: 0.05
  struc_zero: true
  neg_lb: true
  n_cl: 1
  patient_duplicate_policy:
    # Applied only when a comparison formula includes PatientID.
    # Options: keep, drop, error.
    action: "keep"
  comparisons:
    # Legacy-style two-level comparison. `formula` is still accepted as an alias,
    # but new configs should use ANCOM-BC2's `fix_formula`.
    - name: "ControlVsTreatment"
      sample_filter:
        SampleType: ["Control", "Treatment"]
      factor_levels:
        SampleType: ["Control", "Treatment"]
      fix_formula: "SampleType"
      group: "SampleType"
      plot_title: "Control vs Treatment"
      tests: ["primary"]

    # Three-level categorical comparison. The first factor level is the
    # reference unless `reference_level` is set.
    - name: "DoseGlobalDunnett"
      sample_filter:
        DoseGroup: ["Vehicle", "Low", "High"]
      factor_levels:
        DoseGroup: ["Vehicle", "Low", "High"]
      fix_formula: "DoseGroup"
      group: "DoseGroup"
      reference_level: "Vehicle"
      tests: ["global", "dunnet"]
      plot_title: "Dose groups vs vehicle"

    # Ordered trend analysis. Always provide ordered_levels; trend order is
    # never inferred alphabetically.
    - name: "DoseTrend"
      sample_filter:
        DoseGroup: ["Vehicle", "Low", "High"]
      ordered_levels: ["Vehicle", "Low", "High"]
      fix_formula: "DoseGroup"
      group: "DoseGroup"
      tests: ["trend"]
      trend_patterns: ["increasing", "decreasing"]
      plot_title: "Monotonic dose trends"

lefse_analysis:
  source_comparisons: "differential_abundance"
  abundance_scale: "raw_relative_abundance"
  p_adjust_method: "none"
  kruskal_threshold: 0.05
  wilcox_threshold: 0.05
  lda_threshold: 2
  filter: "nonzero"
  subclass_col: null
  seed: 42

blast_confirmation:
  # Differential-abundance candidate selection.
  DA_comparisons: []
  DA_method: "ANCOMBC2"
  # Optional ANCOM-BC2 slice for differential-abundance candidate selection.
  # Leave null for all significant rows, or set e.g. primary/global/dunnet/trend.
  DA_result_test: null
  DA_result_contrast: null

  # Top-abundance candidate selection. Set candidate_source to "top_abundance"
  # and provide candidate_comparisons to run a BLAST confirmation that does not
  # depend on differential-abundance outputs.
  #
  # Manual/reviewed candidate selection. Set candidate_source to "taxa_file"
  # and point candidate_taxa_file at a SelectedTaxa TSV with columns:
  # source, comparison, taxa_level, taxon, selection_metric, selection_reason.
  candidate_source: null
  candidate_comparisons: ["Top10Genera"]
  candidate_taxa_file: null
  candidate_selection_name: null
  top_n_taxa: 10
  candidate_sample_filter: null
  candidate_norm_method: "log2HostMapped"
  candidate_pseudocount: 1

  # BLAST options.
  reference_db: "ncbi20_k2"
  ref_base_dir: "Ref_Data"
  tax_db_sql: "Ref_Data/taxdump/tax_db.sqlite"
  max_target_seqs: 5
  num_threads: null
  min_pident: 90
  min_qcovs: 90
  max_evalue: 1e-20
  top_n_asvs: 20
  min_rel_abund: 0.05
  plot_ranks: ["genus", "species"]

xgboost_classification:
  tax_agg_level: "Genus"
  norm_method: "log2HostMapped"
  pseudocount: 1
  batch_adj_formula: null
  batch_adj_covar: null
  batch_adj_method: "LimmaRemoveBatchEffect"
  split_group_col: "PatientID"
  test_fraction: 0.2
  cv_folds: 5
  seed: 42
  nrounds: 500
  early_stopping_rounds: 20
  prediction_threshold: 0.5
  xgb_params:
    max_depth: 4
    eta: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    gamma: 0
  models:
    - name: "TumorVsNontumor"
      plot_title: "Tumor vs Nontumor"
      sample_filter:
        SampleType: ["Tumor", "Nontumor"]
      target:
        column: "SampleType"
        negative: ["Nontumor"]
        positive: ["Tumor"]
      split_group_col: "PatientID"

survival_analysis:
  time_col: "SurvivalDays"
  status_col: "SurvivalStatus"
  patient_id_col: "PatientID"
  event_code: 1
  censor_code: 0
  min_n: 30
  min_events: 10
  norm_method: "log2HostMapped"
  pseudocount: 1
  sample_strata_col: "SampleType"
  patient_duplicate_policy:
    # Duplicate unit is PatientID + sample_strata_col when strata are enabled.
    # Options: collapse, drop, error.
    action: "collapse"
  methods: ["cox"]
  coda4microbiome:
    lambda: "lambda.1se"
    alpha: 0.9
    nfolds: 10
    nvar: null
    coef_threshold: 0
    seed: 12345
    show_plots: false
    assumption_checks: true
    plot_width: 8
    plot_height: 6
  analyses: []
