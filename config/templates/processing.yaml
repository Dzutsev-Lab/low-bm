# Processing config template.
#
# Runnable local configs are intentionally ignored by git. Initialize
# config/local/processing.yaml from this template, then edit paths and
# references for the machine or project environment where the workflow runs.
#
# Batch-specific values are supplied by config/local/batch.tsv, direct low-bm
# run arguments, or a generated row config:
#   trialID, trial_descript, exp_dir, metadata, and optional process_umis.

in_root: "Exp_Data/"
ip_root: "IP_Data/"
out_root: "Exp_Output/"
script_dir: "scripts"
conda_env_dir: "workflow/envs"

# -------------------------
# Reference Genomes
# -------------------------
host: "human"
human_ref: "Ref_Data/clean.human.fa"
mouse_ref: "Ref_Data/Mus_musculus.GRCm38.cdna.all.fa"
viral_ref: "Ref_Data/all.viral.fna"
bact16s_ref: "Ref_Data/all.rrna.bacteria"

# -------------------------
# UMI Selection Parameters
# -------------------------
# Set to false for libraries constructed without UMIs. Batch rows may override
# this value per experiment with the optional process_umis column.
process_umis: true

r1_primer: "CCTACGGGNGGCWGCAG"
r2_primer: "GGACTACHVGGGTATCTAATCC"
r1_primer_motif_len: 8
r2_primer_motif_len: 7
umi_len: 9
max_offset: 5
r2_primer_skip: false
poly_G_threshold: 1.0

# -------------------------
# Trimmomatic Parameters
# -------------------------
trimmomatic_jar: "$TRIMMOJAR"
trim_args: ["AVGQUAL:30"]

# -------------------------
# DADA2 Parameters
# -------------------------
chunk_size: 5
truncLen: 190
maxN: 0
maxEE: 2
truncQ: 2

# -------------------------
# Mothur Parameters
# -------------------------
mothur_reference: "Ref_Data/ncbi20.fasta"
mothur_tax_file: "Ref_Data/ncbi20.tax"
mothur_cutoff: 0
mothur_method: "wang"

# -------------------------
# Kraken Parameters
# -------------------------
# Current options: silva, greengenes, ncbi20_k2.
kraken_db: "ncbi20_k2"

# -------------------------
# BLAST Parameters
# -------------------------
conf_cutoff: 0.2

# -------------------------
# Taxonomy Count Parameters
# -------------------------
tax_min_counts:
  phylum: 50
  class: 50
  genus: 10
  species: 5

# -------------------------
# Phyloseq Parameters
# -------------------------
add_unclassified_prefix: true
