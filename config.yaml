# Trial infromation (trialID, trial_descript, and exp_dir) taken from experiment_batch_configs.tsv 
#   for SLURM job array submission
#   Can enter manually for bespoke snakemake runs
# trialID Format: ddmmyy.{trial number}
# trial_descript Format: {experiment dataset}_{trial description}
trialID:        ""
trial_descript: ""
exp_dir:        ""
metadata:       ""

in_root:        "Exp_Data/"
ip_root:        "IP_Data/"
out_root:       "Exp_Output/"
script_dir:     "scripts"

#--------------------------
# REFERENCE GENOMES
#--------------------------
host:         "human"
human_ref:    "Ref_Data/clean.human.fa"
mouse_ref:    "Ref_Data/Mus_musculus.GRCm38.cdna.all.fa"
viral_ref:    "Ref_Data/all.viral.fna"
bact16s_ref:  "Ref_Data/all.rrna.bacteria"

#--------------------------
# UMI SELECTION PARAMETERS
#--------------------------
r1_primer: "CCTACGGGNGGCWGCAG"
r2_primer: "GGACTACHVGGGTATCTAATCC"

# r2 Motif length chosen based on default in previous pipeline
#     Note: motif up to first semi-ambiguous nucleotide in primer
#     Did the same thing in selecting r1 primer motif length
r1_primer_motif_len: 8
r2_primer_motif_len: 7
umi_len: 9
max_offset: 5
r2_primer_skip: false
poly_G_threshold: 1.0


#------------------------
# TRIMMOMATIC PARAMETERS
#------------------------
trimmomatic_jar: "$TRIMMOJAR"
trim_args: ["AVGQUAL:30"]

#--------------------
# DADA2 PARAMETERS
#--------------------
# Chunked processing Params
chunk_size: 5

# filterandTrim Params
truncLen: 190
maxN: 0
maxEE: 2
truncQ: 2


#------------------------
# MOTHUR PARAMETERS
#------------------------
mothur_reference: "Ref_Data/ncbi20.fasta"
mothur_tax_file: "Ref_Data/ncbi20.tax"
mothur_cutoff: 0
mothur_method: "wang"


#------------------------
# KRAKEN PARAMETERS
#------------------------
#current options: [silva, greengenes, ncbi20_k2]
kraken_db: "ncbi20_k2"

#-----------------------------
# BLAST PARAMETERS
#-----------------------------
conf_cutoff: 0.2

#---------------------------
# TAXONOMY COUNT PARAMETERS
#---------------------------
tax_min_counts:
  phylum: 50
  class: 50
  genus: 10
  species: 5

#-----------------------------
# PHYLOSEQ PARAMETERS
#-----------------------------
add_unclassified_prefix: true

#----------------------------------
# DIFFERENTIAL ABUDNACE PARAMETERS
#----------------------------------
da_methods: ["ANCOMBC"]
da_comparisons: ["NegativeControl", "PatientSample"]
tax_agg_level: "Genus"
tax_label_level: "Genus"
#current options: [noNorm, RelAbund, RawTSS, HostMapped, log2, log2HostMapped]
norm_method: "noNorm"
pseudocount: 1

